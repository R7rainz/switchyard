services:
  postgres:
    image: postgres:16-alpine
    container_name: switchyard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchyard}
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
    ports:
      # Loopback-only, and 5434 because 5432 and 5433 already belong to other
      # projects on this machine. Nothing outside this host reaches the DB.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - switchyard_postgres_data:/var/lib/postgresql/data
      # No init-directory mount any more. It only ran on an empty volume, so a
      # migration added later never reached an existing database — which is
      # exactly how 0002_credentials went missing. The server now applies
      # migrations itself at startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchyard} -d ${POSTGRES_DB:-switchyard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: golang:1.26-alpine
    working_dir: /app
    command: go run ./cmd/switchyard
    environment:
      DATABASE_URL: postgres://switchyard:switchyard@postgres:5432/switchyard?sslmode=disable
      SWITCHYARD_CREDENTIAL_KEY: ${SWITCHYARD_CREDENTIAL_KEY:-1:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      SWITCHYARD_AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3007}
      SWITCHYARD_AUTH_JWKS_URL: ${SWITCHYARD_AUTH_JWKS_URL:-http://frontend:3007/api/auth/jwks}
      SWITCHYARD_AUTH_AUDIENCE: ${SWITCHYARD_AUTH_AUDIENCE:-switchyard-backend}
      SWITCHYARD_ADDR: :8090
      SWITCHYARD_ARTIFACT_DIR: /app/data/artifacts
      SWITCHYARD_ENV: development
      SWITCHYARD_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8090"
    volumes:
      - ./backend:/app
      - switchyard_go_modules:/go/pkg/mod
      - switchyard_go_build:/root/.cache/go-build
      - switchyard_artifacts:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      DATABASE_URL: postgres://switchyard:switchyard@postgres:5432/switchyard?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-switchyard-local-development-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3007}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3007}:3007"
    volumes:
      - ./frontend:/app
      - switchyard_frontend_node_modules:/app/node_modules
      - switchyard_frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  switchyard_postgres_data:
  switchyard_go_modules:
  switchyard_go_build:
  switchyard_artifacts:
  switchyard_frontend_node_modules:
  switchyard_frontend_next:
